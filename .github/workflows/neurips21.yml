# Contributed by @GuilhemN in https://github.com/erikbern/ann-benchmarks/pull/233
name: Billion-Scale ANN Benchmarks, NeurIPS 2021

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
#          - algorithm: faiss-ivf
#            library: faissconda
#            dataset: random-xs
          - algorithm: faiss-t1
            dataset: random-xs
            library: faissconda            
#          - algorithm: puck-t1
#            dataset: random-xs
#            library: puck
#          - algorithm: faiss-t1
#            dataset: random-range-xs
#            library: faissconda
#          - algorithm: diskann-t2
#            dataset: random-xs
#            library: diskann
#          - algorithm: diskann-t2
#            dataset: random-range-xs
#            library: diskann
          - algorithm: bbann
            dataset: random-xs
            library: bbann
          - algorithm: bbann
            dataset: random-range-xs
            library: bbann
#          - algorithm: httpann_example
#            dataset: random-xs
#            library: httpann_example
#          - algorithm: httpann_example
#            dataset: random-range-xs
#            library: httpann_example
#          - algorithm : kst_ann_t1
#            dataset: random-xs
#            library: kst_ann_t1
#          - algorithm: buddy-t1
#            dataset: random-xs
#            library: faissconda            
#          - algorithm: buddy-t1
#            dataset: random-range-xs
#            library: faissconda            
#          - algorithm: kota-t2
#            dataset: random-xs
#            library: kota
#          - algorithm: kota-t2
#            dataset: random-range-xs
#            library: kota 
#          - algorithm: team11
#            dataset: random-xs
#            library: faissconda
      fail-fast: false

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@df199fb7be9f65074067a9eb93f12bb4c5547cf2 # v2.13.3
      with:
        egress-policy: audit

    - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0

    - name: Set up Python 3.10
      uses: actions/setup-python@e9aba2c848f5ebd159c070c61ea2c4e2b122355e # v2.3.4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install -r requirements_py3.10.txt
        python install.py
      env:
        LIBRARY: ${{ matrix.library }}
        DATASET: ${{ matrix.dataset }}

    - name: Run the benchmark
      run: |
        python create_dataset.py --dataset $DATASET
        python run.py --algorithm $ALGORITHM --max-n-algorithms 2 --dataset $DATASET --timeout 600
        sudo chmod -R 777 results/
        python plot.py --dataset $DATASET --output plot.png
        python data_export.py --output test.csv

      env:
        ALGORITHM: ${{ matrix.algorithm}}
        DATASET: ${{ matrix.dataset }}
